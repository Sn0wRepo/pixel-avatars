[package]
name = "pixelid"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Deterministic pixel identicons (Blockies + on-chain PixelID) with SVG and PNG output"
license = "MIT"
readme = "../README.md"
keywords = ["identicon", "blockies", "ethereum", "avatar", "pixel-art"]
categories = ["multimedia::images", "command-line-utilities"]

[lib]
name = "pixelid"
path = "src/lib.rs"

[[bin]]
name = "pixelid"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "png"]
cli = ["dep:clap", "dep:anyhow"]
png = ["dep:png"]

[dependencies]
tiny-keccak = { version = "2", features = ["keccak"] }
png = { version = "0.17", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
